name: Fetch RWA Holders Data

on:
  schedule:
    # Run every 12 hours at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          RWA_API_TOKEN: ${{ secrets.RWA_API_TOKEN }}
        run: python fetch_rwa_data.py

      - name: Run protocol summary pipeline
        env:
          RWA_API_TOKEN: ${{ secrets.RWA_API_TOKEN }}
        run: python fetch_protocol_summary.py

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        run: |
          git add snapshots/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RWA holders data - $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
